trigger: none

name: FileServer-OneClick-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: fileServerAssetUrl
    displayName: Signed FileServer ZIP URL
    type: string
    default: ''
  - name: fileServerAssetSha256
    displayName: Signed FileServer ZIP SHA-256
    type: string
    default: ''
  - name: fileServerAssetVersion
    displayName: FileServer version written to Tools.json (optional)
    type: string
    default: ''
  - name: ptmServiceAssetUrl
    displayName: Signed PTMService ZIP URL
    type: string
    default: ''
  - name: ptmServiceAssetSha256
    displayName: Signed PTMService ZIP SHA-256
    type: string
    default: ''
  - name: ptmServiceAssetVersion
    displayName: PTMService version written to Tools.json (optional)
    type: string
    default: ''
  - name: ptmCliAssetUrl
    displayName: Signed PTMCli ZIP URL
    type: string
    default: ''
  - name: ptmCliAssetSha256
    displayName: Signed PTMCli ZIP SHA-256
    type: string
    default: ''
  - name: ptmCliAssetVersion
    displayName: PTMCli version written to Tools.json (optional)
    type: string
    default: ''
  - name: workgroupTag
    displayName: Workgroup OneClick tag
    type: string
    default: 4.26.8.0
  - name: domainTag
    displayName: Domain OneClick tag
    type: string
    default: 4.26.8.0
  - name: clusterTag
    displayName: Cluster OneClick tag
    type: string
    default: 4.26.9.0

variables:
  - group: ESRP Variables
  - name: codeSign.signerSubject
    value: CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    sdl:
      codeql:
        compiled:
          enabled: false
        interpreted:
          enabled: true
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: Build_Sign_And_Package
        displayName: Build, sign, and package FileServer OneClick assets
        jobs:
          - job: BuildOneClickPackages
            displayName: Build signed OneClick packages
            timeoutInMinutes: 120
            workspace:
              clean: true
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: FileServer-OneClick-Packages
                  targetPath: $(Build.ArtifactStagingDirectory)/drop
                  displayName: Publish signed OneClick packages
            steps:
              - checkout: self
                path: s
                clean: true

              - template: /pipelines/1es/templates/FileServer-OneClick-Package-Steps.yml@self
                parameters:
                  automationSourcePath: $(Pipeline.Workspace)\s\TestSuites\FileServer\azure-automation
                  fileServerAssetUrl: ${{ parameters.fileServerAssetUrl }}
                  fileServerAssetSha256: ${{ parameters.fileServerAssetSha256 }}
                  fileServerAssetVersion: ${{ parameters.fileServerAssetVersion }}
                  ptmServiceAssetUrl: ${{ parameters.ptmServiceAssetUrl }}
                  ptmServiceAssetSha256: ${{ parameters.ptmServiceAssetSha256 }}
                  ptmServiceAssetVersion: ${{ parameters.ptmServiceAssetVersion }}
                  ptmCliAssetUrl: ${{ parameters.ptmCliAssetUrl }}
                  ptmCliAssetSha256: ${{ parameters.ptmCliAssetSha256 }}
                  ptmCliAssetVersion: ${{ parameters.ptmCliAssetVersion }}
                  workgroupTag: ${{ parameters.workgroupTag }}
                  domainTag: ${{ parameters.domainTag }}
                  clusterTag: ${{ parameters.clusterTag }}
                  packageSourceRevision: $(Build.SourceVersion)
