trigger: none

name: FileServer-Release-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: releaseTag
    displayName: FileServer and OneClick release tag
    type: string
    default: 4.26.9.0
  - name: testSuitesBranch
    displayName: WPTS source branch
    type: string
    default: main
  - name: testSuitesCommit
    displayName: WPTS source commit SHA
    type: string
    default: ''
  - name: ptmServiceAssetUrl
    displayName: Signed PTMService ZIP URL
    type: string
    default: ''
  - name: ptmServiceAssetSha256
    displayName: Signed PTMService ZIP SHA-256
    type: string
    default: ''
  - name: ptmServiceAssetVersion
    displayName: PTMService version
    type: string
    default: ''
  - name: ptmCliAssetUrl
    displayName: Signed PTMCli ZIP URL
    type: string
    default: ''
  - name: ptmCliAssetSha256
    displayName: Signed PTMCli ZIP SHA-256
    type: string
    default: ''
  - name: ptmCliAssetVersion
    displayName: PTMCli version
    type: string
    default: ''
  - name: codeSignDefinitionId
    displayName: FileServer codesign pipeline definition ID
    type: number
    default: 56330
  - name: existingCodeSignBuildId
    displayName: Existing successful codesign build ID (optional; 0 queues a new build)
    type: number
    default: 0
  - name: codeSignBranch
    displayName: Codesign helper source branch
    type: string
    default: main
  - name: codeSignCommit
    displayName: Codesign helper source commit SHA
    type: string
    default: ''
  - name: githubRepository
    displayName: Public GitHub release repository
    type: string
    default: microsoft/WindowsProtocolTestSuites

variables:
  - group: ESRP Variables
  - name: codeSign.signerSubject
    value: CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US
  - name: FileServerPublicUrl
    value: https://github.com/${{ parameters.githubRepository }}/releases/download/${{ parameters.releaseTag }}/FileServer-TestSuite-ServerEP.zip

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    sdl:
      codeql:
        compiled:
          enabled: false
        interpreted:
          enabled: true
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: Build_Release_Bundle
        displayName: Build signed FileServer and OneClick release bundle
        jobs:
          - job: BuildReleaseBundle
            displayName: Orchestrate signed FileServer release assets
            timeoutInMinutes: 360
            workspace:
              clean: true
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: FileServer-Release-Bundle
                  targetPath: $(Build.ArtifactStagingDirectory)/drop
                  displayName: Publish FileServer release bundle
            steps:
              - checkout: self
                path: s
                clean: true
                persistCredentials: true

              - task: PowerShell@2
                displayName: Stage the immutable FileServer deployment source
                env:
                  TESTSUITES_BRANCH: ${{ parameters.testSuitesBranch }}
                  TESTSUITES_COMMIT: ${{ parameters.testSuitesCommit }}
                  CODESIGN_COMMIT: ${{ parameters.codeSignCommit }}
                  PTMSERVICE_VERSION: ${{ parameters.ptmServiceAssetVersion }}
                  PTMCLI_VERSION: ${{ parameters.ptmCliAssetVersion }}
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    if ($env:TESTSUITES_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
                      throw 'testSuitesCommit must be a full 40-character commit SHA.'
                    }
                    if ($env:CODESIGN_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
                      throw 'codeSignCommit must be a full 40-character commit SHA for a helper revision that supports immutable source pinning and provenance.'
                    }
                    if ([string]::IsNullOrWhiteSpace($env:PTMSERVICE_VERSION) -or
                        [string]::IsNullOrWhiteSpace($env:PTMCLI_VERSION)) {
                      throw 'PTMService and PTMCli versions are required.'
                    }

                    $repository = "$(Pipeline.Workspace)\s"
                    $sourceRoot = "$(Build.ArtifactStagingDirectory)\source"
                    $sourceArchive = "$(Build.ArtifactStagingDirectory)\source.zip"
                    Remove-Item -LiteralPath $sourceRoot -Recurse -Force -ErrorAction SilentlyContinue
                    Remove-Item -LiteralPath $sourceArchive -Force -ErrorAction SilentlyContinue

                    git -C $repository fetch --no-tags origin $env:TESTSUITES_COMMIT --depth=1
                    if ($LASTEXITCODE -ne 0) {
                      throw "Unable to fetch WPTS commit '$($env:TESTSUITES_COMMIT)'."
                    }
                    $resolvedCommit = git -C $repository rev-parse "$($env:TESTSUITES_COMMIT)^{commit}"
                    if ($LASTEXITCODE -ne 0 -or $resolvedCommit -ne $env:TESTSUITES_COMMIT.ToLowerInvariant()) {
                      throw "Fetched WPTS commit did not resolve to '$($env:TESTSUITES_COMMIT)'."
                    }

                    git -C $repository archive --format=zip --output=$sourceArchive `
                      $env:TESTSUITES_COMMIT TestSuites/FileServer/azure-automation
                    if ($LASTEXITCODE -ne 0) {
                      throw 'Unable to archive the immutable FileServer deployment source.'
                    }
                    Expand-Archive -LiteralPath $sourceArchive -DestinationPath $sourceRoot
                    Remove-Item -LiteralPath $sourceArchive -Force

              - task: PowerShell@2
                displayName: Queue, verify, and download signed FileServer package
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                inputs:
                  targetType: filePath
                  pwsh: true
                  filePath: $(Pipeline.Workspace)\s\TestSuites\FileServer\azure-automation\shared\Invoke-FileServerCodeSign.ps1
                  arguments: >
                    -CollectionUri "$(System.CollectionUri)"
                    -Project "$(System.TeamProject)"
                    -CodeSignDefinitionId "${{ parameters.codeSignDefinitionId }}"
                    -ExistingCodeSignBuildId "${{ parameters.existingCodeSignBuildId }}"
                    -TestSuitesBranch "${{ parameters.testSuitesBranch }}"
                    -TestSuitesCommit "${{ parameters.testSuitesCommit }}"
                    -CodeSignBranch "${{ parameters.codeSignBranch }}"
                    -CodeSignCommit "${{ parameters.codeSignCommit }}"
                    -FileServerAssetUrl "$(FileServerPublicUrl)"
                    -FileServerAssetVersion "${{ parameters.releaseTag }}"
                    -SignerSubject "$(codeSign.signerSubject)"
                    -OutputDirectory "$(Build.ArtifactStagingDirectory)\drop"
                    -TimeoutMinutes 240

              - template: /pipelines/1es/templates/FileServer-OneClick-Package-Steps.yml@self
                parameters:
                  automationSourcePath: $(Build.ArtifactStagingDirectory)\source\TestSuites\FileServer\azure-automation
                  fileServerAssetUrl: $(FileServerPublicUrl)
                  fileServerAssetSha256: $(FileServerAssetSha256)
                  fileServerAssetVersion: ${{ parameters.releaseTag }}
                  ptmServiceAssetUrl: ${{ parameters.ptmServiceAssetUrl }}
                  ptmServiceAssetSha256: ${{ parameters.ptmServiceAssetSha256 }}
                  ptmServiceAssetVersion: ${{ parameters.ptmServiceAssetVersion }}
                  ptmCliAssetUrl: ${{ parameters.ptmCliAssetUrl }}
                  ptmCliAssetSha256: ${{ parameters.ptmCliAssetSha256 }}
                  ptmCliAssetVersion: ${{ parameters.ptmCliAssetVersion }}
                  workgroupTag: ${{ parameters.releaseTag }}
                  domainTag: ${{ parameters.releaseTag }}
                  clusterTag: ${{ parameters.releaseTag }}
                  packageSourceRevision: ${{ parameters.testSuitesCommit }}
                  codeSignBuildId: $(FileServerCodeSignBuildId)
